name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e ".[notebook]"
      - run: python -m unittest discover -s tests
      - run: python examples/synthetic_analysis.py
      - name: Execute ordered demo without saving outputs
        run: python -c "import nbformat; from nbclient import NotebookClient; nb = nbformat.read('demo.ipynb', as_version=4); NotebookClient(nb, timeout=120, kernel_name='python3').execute()"
      - run: python scripts/check_release.py
